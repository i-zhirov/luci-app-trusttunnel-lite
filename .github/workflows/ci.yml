name: CI

on:
  push:
    branches: [ main ]
    # Matches the release.yml trigger: without it a tag could go into a release
    # without a single test run, because a tag push by itself did not trigger CI.
    tags: [ 'v*' ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      # Defect that made the package install but the service not work: all
      # scripts went into the .apk with mode 100644. luci.mk copies root/ with
      # `cp -pR`, i.e. it keeps the source permissions, and development was done
      # on Windows, where there is no executable bit. On the router this looked
      # like "service does not start" WITHOUT A SINGLE LINE in the log — procd
      # just cannot execute the file, and there is nothing to diagnose.
      #
      # Modes are also fixed in the Makefile (Build/Compile), but this check is
      # needed separately: it catches the cause in the index, not the effect in
      # the build.
      - name: Executable bits
        run: |
          need="packages/luci-app-trusttunnel-lite/root/etc/init.d/trusttunnel
          packages/luci-app-trusttunnel-lite/root/etc/uci-defaults/40-luci-trusttunnel
          packages/luci-app-trusttunnel-lite/root/etc/hotplug.d/net/40-trusttunnel
          packages/luci-app-trusttunnel-lite/root/usr/libexec/trusttunnel/gen-config
          packages/luci-app-trusttunnel-lite/root/usr/libexec/trusttunnel/routing
          packages/luci-app-trusttunnel-lite/root/usr/libexec/trusttunnel/uci-export
          install.sh
          uninstall.sh"
          fail=0
          for f in $need; do
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            [ "$mode" = "100755" ] && continue
            echo "::error file=$f::mode is $mode, expected 100755 — the package would ship a script that cannot run"
            fail=1
          done
          [ "$fail" = 0 ] && echo "every script that must run is executable in the index"
          exit "$fail"

      - name: Unit tests
        run: sh tests/run.sh

      # The version is PINNED, and it is not pedantry: the apt version changed
      # along with the runner image, and every shellcheck release adds new
      # checks. That is exactly how CI first broke — on SC2317, which did not
      # exist in the previous version, with completely unchanged code. An
      # unpinned linter means a build that breaks on its own at an arbitrary
      # moment.
      #
      # A container, not apt: the same image runs locally with a single command,
      # so findings reproduce before the push instead of being found in CI.
      # Updating the version is a deliberate step done with verification, not a
      # side effect.
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD:/src" -w /src koalaman/shellcheck:v0.11.0 -s sh \
            install.sh \
            uninstall.sh \
            tests/run.sh \
            packages/luci-app-trusttunnel-lite/root/usr/libexec/trusttunnel/records.sh \
            packages/luci-app-trusttunnel-lite/root/usr/libexec/trusttunnel/gen-config \
            packages/luci-app-trusttunnel-lite/root/usr/libexec/trusttunnel/routing \
            packages/luci-app-trusttunnel-lite/root/usr/libexec/trusttunnel/uci-export \
            packages/luci-app-trusttunnel-lite/root/etc/uci-defaults/40-luci-trusttunnel

      - name: Shell syntax of the init script
        run: sh -n packages/luci-app-trusttunnel-lite/root/etc/init.d/trusttunnel

      # The ucode syntax check (`uc -c` in release.yml) does NOT catch a missing
      # import: calling an undeclared function is a runtime error, not a parse
      # one. That is how `rand()` from the math module, used without an import,
      # broke both the config import and the domain check at once and was not
      # noticed by any check. This step cross-checks the functions actually
      # called against the list of those living in modules rather than in the
      # ucode core.
      - name: ucode module imports
        run: |
          f=packages/luci-app-trusttunnel-lite/root/usr/share/rpcd/ucode/luci.trusttunnel
          # Functions that are NOT in the ucode core: each one requires an
          # import from a module. The list is intentionally short — only what
          # this backend can actually need; extend as necessary.
          fail=0
          for pair in \
            'math:rand' 'math:srand' 'math:sqrt' 'math:pow' 'math:abs' \
            'fs:readfile' 'fs:writefile' 'fs:popen' 'fs:access' 'fs:unlink' \
            'fs:stat' 'fs:mkdir' 'fs:chmod' 'fs:mkstemp' 'fs:opendir' \
            'ubus:connect' 'uci:cursor'
          do
            mod=${pair%%:*}; fn=${pair##*:}
            # A function call: the name with a parenthesis, not part of another word.
            if grep -qE "(^|[^A-Za-z0-9_.])${fn}[[:space:]]*\(" "$f"; then
              if ! grep -qE "^import[[:space:]]*\{[^}]*\b${fn}\b[^}]*\}[[:space:]]*from[[:space:]]*'${mod}'" "$f"; then
                echo "::error file=$f::${fn}() is used but not imported from '${mod}' — this fails at runtime, not at parse time"
                fail=1
              fi
            fi
          done
          [ "$fail" = 0 ] && echo "every module function used is imported"
          exit "$fail"

      # The ucode syntax check. Previously release.yml did it by building
      # host-ucode inside the SDK container; the switch to openwrt/gh-action-sdk
      # took that ability away — the whole build moved inside the action.
      # Without a check, a syntax error in the backend goes into a release
      # unnoticed: it is a thousand lines in ONE file that rpcd loads entirely,
      # and a parse error disables not one function but the whole package.
      #
      # The check moved HERE instead of staying in the release build, and this
      # made it stricter: it now runs on every PR rather than once per release.
      #
      # The compiler is built from sources with the fs and math modules — exactly
      # the ones the backend imports. This is not decoration: `ucode -c` resolves
      # imports at compile time, and without math.so the check fails right on
      # the line `import { rand, srand } from 'math'` — i.e. it rejects an
      # obviously valid file. Verified: without -DMATH_SUPPORT=ON the step fails
      # with exit code 255 on line 10.
      #
      # The version is pinned for the same reason as the shellcheck version:
      # an unpinned tool breaks the build on its own at an arbitrary moment,
      # with completely unchanged code.
      - name: ucode syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libjson-c-dev pkg-config
          git clone --depth 1 -b v0.0.20250529 https://github.com/jow-/ucode /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build -DCMAKE_BUILD_TYPE=Release \
            -DFS_SUPPORT=ON -DMATH_SUPPORT=ON \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DRTNL_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DLOG_SUPPORT=OFF \
            -DDEBUG_SUPPORT=OFF
          cmake --build /tmp/ucode/build -j"$(nproc)"
          uc=/tmp/ucode/build/ucode
          "$uc" -L '/tmp/ucode/build/*.so' -c \
            packages/luci-app-trusttunnel-lite/root/usr/share/rpcd/ucode/luci.trusttunnel

          # A control on the check itself: a compiler that accepts an obviously
          # broken file checks nothing, and a green step would be lying.
          printf 'let x = ;\n' > /tmp/broken.uc
          if "$uc" -L '/tmp/ucode/build/*.so' -c /tmp/broken.uc 2>/dev/null; then
            echo "::error::the syntax check accepts broken input and proves nothing"
            exit 1
          fi
          echo "ucode syntax ok"

      - name: JSON syntax
        run: |
          for f in $(find packages -name '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done


      # The same class of error as with ucode imports, and it is caught just as
      # poorly: `node --check` checks syntax, while referencing an undeclared
      # LuCI module fails AT RUNTIME. That is how "ui is not defined" got onto
      # the diagnostics tab: tools using ui were moved from the status page,
      # but the 'require ui' line was not.
      - name: LuCI module requires
        run: |
          # The search is specifically for a CALL — `module.something(` — not
          # any mention: the word "network." occurs in field description text,
          # and a substring check gave false positives. Comments and quoted text
          # contain no calls, so this marker is enough.
          mods="ui dom rpc uci form view poll fs network validation"
          fail=0
          for f in packages/luci-app-trusttunnel-lite/htdocs/luci-static/resources/view/trusttunnel/*.js; do
            for m in $mods; do
              grep -qE "(^|[^A-Za-z0-9_.$])${m}\.[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(" "$f" || continue
              grep -qE "^'require ${m}'" "$f" && continue
              echo "::error file=$f::${m} is used but not declared with 'require ${m}' — this fails at runtime, not at parse time"
              fail=1
            done
          done
          [ "$fail" = 0 ] && echo "every LuCI module used is declared"
          exit "$fail"

      - name: JavaScript syntax
        run: |
          # node --check on a plain LuCI view file is not reliable across
          # Node versions/module-type detection because each view ends with
          # a top-level `return` (LuCI views are written to be wrapped in a
          # function by the loader, not to be a standalone CommonJS module).
          # Parsing each file's source wrapped in a function expression
          # sidesteps that and checks the same thing `--check` would.
          node -e '
            const fs = require("fs");
            const vm = require("vm");
            let failed = false;
            for (const f of process.argv.slice(1)) {
              const src = fs.readFileSync(f, "utf8");
              try {
                new vm.Script("(function(){\n" + src + "\n})");
                console.log("ok: " + f);
              } catch (e) {
                failed = true;
                console.error(f + ": " + e.message);
              }
            }
            if (failed) process.exit(1);
          ' packages/luci-app-trusttunnel-lite/htdocs/luci-static/resources/view/trusttunnel/*.js
