name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Without this block publishing the release fails with 403 "Resource not
# accessible by integration": GITHUB_TOKEN is granted read-only by default,
# while creating a release requires write access to contents. Verified on a live
# run against tag v1.0.0 — everything built and uploaded, exactly the last step
# failed.
#
# The right is declared HERE rather than with a toggle in the repository
# settings: this way it travels with the code (fork, move, restore from clone)
# and is visible when reading the workflow. Only the minimum needed is granted.
# pages:write and id-token:write are required by the deploy-pages action that
# publishes the package repositories to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # The noarch LuCI package: built once per package-manager generation, on
  # the canonical x86-64 SDK.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The apk branch: the canonical .apk is published to the release.
          - version: 25.12.5
            ext: apk
          # The opkg branch: ONE canonical .ipk is built, on the oldest SDK
          # (22.03) — the package's dependencies are unversioned, so the same
          # artifact installs on 23.05/24.10. That claim is verified by the
          # install test in the publish-repo job, not by extra SDK builds:
          # building on 23.05/24.10 would prove nothing about the 22.03-built
          # file anyway.
          - version: 22.03.7
            ext: ipk
          # No builds for other client architectures on purpose: the package
          # is noarch (LUCI_PKGARCH:=all), so the built artifact is identical
          # on every SDK — the axis that actually changes the build is the
          # OpenWrt VERSION (luci.mk, opkg vs apk, findrev versioning), and it
          # is covered by the two branches above, both built on the same
          # canonical x86-64 SDK. The arch-specific trusttunnel-client is NOT
          # built here: the build-client job covers every architecture.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The artifacts directory is separated from the feed DELIBERATELY: the
      # action moves the built bin/ into ARTIFACTS_DIR, while our feed is now
      # the whole repository — without this separation a hundred foreign .apk
      # files would be dumped straight into the working tree. The directory is
      # created in advance: the action `chown`s both paths BEFORE starting the
      # container and fails on a missing one.
      - name: Prepare the artifacts directory
        run: mkdir -p out

      # The build is delegated to the standard OpenWrt action: it brings up the
      # SDK container, feeds the repository in as a feed, and builds the
      # package. In exchange for a hundred and forty lines of manual
      # orchestration we also get `make package/<pkg>/check` — the metadata and
      # hash check that the manual variant did not have.
      #
      # The price of the switch is time: staging_dir and build_dir live inside
      # the container and are inaccessible to actions/cache, so dependencies (luci-base, ucode, curl, the toolchain) are built from
      # scratch every time. By measurements it costs nothing: releases
      # 1.0.5–1.0.9 with the manual cache took 12 m 09 s – 12 m 36 s, the first
      # run on the action — 11 m 13 s. The cache barely hit even before.
      - name: Build package via OpenWrt SDK Action
        uses: openwrt/gh-action-sdk@v7
        env:
          # The SDK image tag is <target>-<version>; the target is always
          # x86-64 — the one canonical SDK for the noarch build (see the
          # matrix above), only the OpenWrt version varies.
          ARCH: x86-64-${{ matrix.version }}
          FEEDNAME: ttowrt
          # The feed is the WHOLE repository, not the packages/ directory, and
          # the path MUST be ABSOLUTE. Two different reasons, both verified.
          #
          # Absolute — because the action substitutes this value directly into
          # `docker run -v <FEED_DIR>:/feed`, and docker treats a relative
          # value not as a directory but as a VOLUME NAME: an empty volume
          # arrives in the container, the feed comes out empty, and the build
          # fails at `make package/luci-app-trusttunnel-lite/download`. Verified
          # locally: `docker run -v packages:/feed alpine ls /feed` shows
          # emptiness.
          #
          # The whole repository — because .git must get into the container
          # together with packages/. luci.mk takes the translation package
          # version from `git log -1` (findrev in luci.mk), and without the
          # repository a fallback timestamp branch kicks in: instead of
          # 26.238.08051~9f6fb1a you get 0.260826.21528. This is not cosmetics —
          # apk sees a DOWNGRADE in such a version and writes "Downgrading
          # luci-i18n-trusttunnel-lite-ru (26.237.58633~00f8120 ->
          # 0.260826.21528)". Verified on a live router via `apk add --simulate`.
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ github.workspace }}/out
          PACKAGES: luci-app-trusttunnel-lite

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # The build produces TWO packages: luci-app itself and the translation
          # package that luci.mk generates from po/ru as luci-i18n-trusttunnel-lite-ru.
          find out/bin/ -name "luci-app-trusttunnel-lite*.${{ matrix.ext }}" -exec cp {} dist/ \;
          find out/bin/ -name "luci-i18n-trusttunnel-*.${{ matrix.ext }}" -exec cp {} dist/ \;
          ls -la dist/
          # A missing of either of the two packages is a build error, and it
          # must be noticed here, not by the user.
          ls dist/luci-app-trusttunnel-lite*.${{ matrix.ext }} >/dev/null
          ls dist/luci-i18n-trusttunnel-*.${{ matrix.ext }} >/dev/null

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.version }}
          path: dist/*

      # The manual variant built with V=s and printed the build progress right
      # into the step log; the action does not do that, but it stores logs in
      # logs/ (BUILD_LOG=1 is its default) and moves them into the working
      # directory together with bin/. Without this step a failed build leaves
      # nothing but the last line of make.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.version }}
          path: out/logs/
          if-no-files-found: ignore

  # The arch-specific client: built once per OpenWrt SUBTARGET architecture,
  # per package-manager generation. Two hard facts force this matrix:
  #
  #  1. The vendor ships one prebuilt binary per CPU FAMILY (x86_64, aarch64,
  #     armv7, mips, mipsel), statically linked, and packages/trusttunnel-client
  #     downloads the family tarball by mapping $(ARCH) to the vendor name.
  #     The binary is the same for every subtarget of the family — only the
  #     arch LABEL in the package metadata differs.
  #
  #  2. apk matches the package arch against the device's own arch
  #     byte-for-byte (verified on openwrt/rootfs:x86_64-25.12.0: a package of
  #     a sibling arch — aarch64_cortex-a53 on aarch64_cortex-a72 — is refused
  #     with "error: uninstallable, arch: ..."). opkg is more lenient: it
  #     ignores foreign-arch packages in a merged feed and picks the matching
  #     build (verified on openwrt/rootfs:x86_64-22.03.7). The apk repositories
  #     are therefore PER-ARCHITECTURE (apk/<arch>/ on the Pages site, like the
  #     official OpenWrt layout), while the opkg repository stays a single
  #     merged feed.
  #
  # Every subtarget arch whose CPU belongs to a supported family is built:
  # the matrix below is the complete list of such archs in the 25.12 and
  # 22.03 release trees (all SDK images exist; the excluded arm_arm926ej-s,
  # arm_xscale, arm_fa526, mips64_*, riscv64_*, powerpc_*, i386_*,
  # loongarch64_* archs have no vendor build and no client package — the
  # install.sh CPU check rejects those devices up front).
  build-client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # apk branch (25.12+): 20 architectures.
          - { version: 25.12.5, ext: apk,  arch: x86_64 }
          - { version: 25.12.5, ext: apk,  arch: aarch64_generic }
          - { version: 25.12.5, ext: apk,  arch: aarch64_cortex-a53 }
          - { version: 25.12.5, ext: apk,  arch: aarch64_cortex-a72 }
          - { version: 25.12.5, ext: apk,  arch: aarch64_cortex-a76 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a5_vfpv4 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a7 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a7_neon-vfpv4 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a7_vfpv4 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a8_vfpv3 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a9 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a9_neon }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a9_vfpv3-d16 }
          - { version: 25.12.5, ext: apk,  arch: arm_cortex-a15_neon-vfpv4 }
          - { version: 25.12.5, ext: apk,  arch: mips_24kc }
          - { version: 25.12.5, ext: apk,  arch: mips_mips32 }
          - { version: 25.12.5, ext: apk,  arch: mipsel_24kc }
          - { version: 25.12.5, ext: apk,  arch: mipsel_24kc_24kf }
          - { version: 25.12.5, ext: apk,  arch: mipsel_74kc }
          - { version: 25.12.5, ext: apk,  arch: mipsel_mips32 }
          # opkg branch (22.03-24.10): the same list minus aarch64_cortex-a76,
          # which exists only in the 25.12 release tree.
          - { version: 22.03.7, ext: ipk,  arch: x86_64 }
          - { version: 22.03.7, ext: ipk,  arch: aarch64_generic }
          - { version: 22.03.7, ext: ipk,  arch: aarch64_cortex-a53 }
          - { version: 22.03.7, ext: ipk,  arch: aarch64_cortex-a72 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a5_vfpv4 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a7 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a7_neon-vfpv4 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a7_vfpv4 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a8_vfpv3 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a9 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a9_neon }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a9_vfpv3-d16 }
          - { version: 22.03.7, ext: ipk,  arch: arm_cortex-a15_neon-vfpv4 }
          - { version: 22.03.7, ext: ipk,  arch: mips_24kc }
          - { version: 22.03.7, ext: ipk,  arch: mips_mips32 }
          - { version: 22.03.7, ext: ipk,  arch: mipsel_24kc }
          - { version: 22.03.7, ext: ipk,  arch: mipsel_24kc_24kf }
          - { version: 22.03.7, ext: ipk,  arch: mipsel_74kc }
          - { version: 22.03.7, ext: ipk,  arch: mipsel_mips32 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare the artifacts directory
        run: mkdir -p out

      # Same action and same reasons as in the build job (absolute FEED_DIR,
      # the whole repository as the feed); the only difference is the SDK
      # image, picked by the matrix entry.
      - name: Build package via OpenWrt SDK Action
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          FEEDNAME: ttowrt
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ github.workspace }}/out
          PACKAGES: trusttunnel-client

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # The apk file name carries NO arch: apk reconstructs package file
          # names from the metadata (name-version, verified), so every apk
          # build produces trusttunnel-client-<version>-r<release>.apk. The
          # arch is appended here, or the 20 artifacts would overwrite each
          # other when publish-repo merges them; publish-repo strips it back
          # when placing the file into the per-architecture repository. The
          # ipk name (trusttunnel-client_<version>_<arch>.ipk) already
          # contains the arch and needs no renaming.
          if [ "${{ matrix.ext }}" = "apk" ]; then
            f=$(find out/bin/ -name 'trusttunnel-client*.apk' | head -n1)
            [ -n "$f" ] || { echo "no trusttunnel-client apk was built" >&2; exit 1; }
            cp "$f" "dist/$(basename "$f" .apk)-${{ matrix.arch }}.apk"
            # The arch marker lets publish-repo recover the list of
            # architectures from the artifacts instead of keeping a second
            # copy of the matrix in a shell loop.
            printf '%s\n' "${{ matrix.arch }}" > "dist/ARCH-${{ matrix.arch }}"
          else
            f=$(find out/bin/ -name 'trusttunnel-client*.ipk' | head -n1)
            [ -n "$f" ] || { echo "no trusttunnel-client ipk was built" >&2; exit 1; }
            cp "$f" dist/
          fi
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-client-${{ matrix.version }}-${{ matrix.arch }}
          path: dist/*

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-client-${{ matrix.version }}-${{ matrix.arch }}
          path: out/logs/
          if-no-files-found: ignore

  # Assembles the package repositories that install.sh configures the
  # routers to use and deploys them to GitHub Pages via the Actions
  # deployment: apk/<arch>/ (per-architecture directories: the noarch LuCI
  # packages, the client built for that arch, a signed packages.adb and the
  # signing key at apk/key-build.pub) and opkg/ (one merged feed with every
  # architecture's packages, Packages/Packages.gz/Packages.sig and
  # opkg-key.pub), served from
  # https://i-zhirov.github.io/luci-app-trusttunnel-lite/. Nothing is
  # committed to any branch — the site is the workflow's direct output, so
  # no binaries ever enter git history.
  #
  # The repositories live on the Pages site, not in the GitHub releases:
  # the translation package's version contains a '~' (LuCI's findrev
  # format), and GitHub release asset names cannot contain '~' (it is
  # silently replaced with '.'), while apk reconstructs package file names
  # from the version verbatim. Pages serves file names byte-identically, so
  # the indexes and the packages are served unchanged — and the opkg
  # repository shares the same location for consistency.
  #
  # Runs on tag pushes (the release flow) and on workflow_dispatch, which
  # is how a manual re-deploy of the current packages is triggered.
  publish-repo:
    needs: [build, build-client]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # The checkout provides the site template (repo-site/) and the public
      # halves of the signing keys (key-build.pub, opkg-key.pub).
      - uses: actions/checkout@v7
      - name: Download the apk artifacts
        uses: actions/download-artifact@v7
        with:
          name: package-25.12.5
          path: staging/luci-apk
      - name: Download the opkg artifacts
        uses: actions/download-artifact@v7
        with:
          name: package-22.03.7
          path: staging/luci-ipk
      # The client artifacts are merged per package-manager generation: the
      # apk file names carry the appended arch (see the build-client job) and
      # the ipk file names carry the arch natively, so nothing collides.
      - name: Download the client artifacts (25.12 apk)
        uses: actions/download-artifact@v7
        with:
          pattern: package-client-25.12.5-*
          path: staging/apk-pkgs
          merge-multiple: true
      - name: Download the client artifacts (22.03 ipk)
        uses: actions/download-artifact@v7
        with:
          pattern: package-client-22.03.7-*
          path: staging/opkg-pkgs
          merge-multiple: true

      # The repository indexes that install.sh's repository flow needs:
      # packages.adb per apk architecture, Packages/Packages.gz/Packages.sig
      # for the merged opkg feed, plus the public signing keys. The GitHub
      # release itself carries only the package files, for manual download.
      #
      # The package managers' expectations differ:
      #   apk  — the repository entry names the index file explicitly
      #          (<url>/apk/<arch>/packages.adb) and apk fetches it as-is;
      #   opkg — the feed URL must NOT name the index (opkg appends
      #          /Packages.gz), and the signature covers the UNCOMPRESSED
      #          Packages because opkg-key zcat's the list before verifying.
      # The package files are referenced by the indexes exactly by their
      # file names, so the fetches resolve within the same site.
      - name: Assemble and index the apk repositories
        env:
          SIGN_KEY: ${{ secrets.TT_APK_SIGN_KEY }}
        run: |
          # The private key exists only as a workflow secret; its public
          # half (key-build.pub, committed in the repository) is carried to
          # the site and installed by install.sh into /etc/apk/keys/.
          #
          # The repositories are per-architecture (apk is strict about the
          # arch label; see the build-client job), and the router configures
          # ONLY its own arch directory, so the noarch LuCI packages are
          # copied into every one of them.
          cp key-build.pub staging/apk/
          printf '%s\n' "$SIGN_KEY" > key-build.sec
          # The arch list comes from the ARCH-<arch> markers in the client
          # artifacts — no second copy of the matrix to keep in sync.
          for m in staging/apk-pkgs/ARCH-*; do
            [ -e "$m" ] || { echo "no client artifacts for any architecture" >&2; exit 1; }
            arch=${m##*/}
            arch=${arch#ARCH-}
            mkdir -p "staging/apk/$arch"
            cp staging/luci-apk/*.apk "staging/apk/$arch/"
            f=$(find staging/apk-pkgs -maxdepth 1 -name "trusttunnel-client-*.$arch.apk" | head -n1)
            [ -n "$f" ] || { echo "missing trusttunnel-client build for $arch" >&2; exit 1; }
            # apk fetches a package by the name reconstructed from its
            # metadata (name-version, no arch), so inside the repository the
            # file must be named exactly that.
            cp "$f" "staging/apk/$arch/$(basename "$f" .$arch.apk).apk"
            echo "  $arch: $(basename "$f")"
          done
          # alpine:edge is the only readily available apk-tools 3.x with
          # mkndx/adbsign (stable Alpine ships apk-tools 2.14). Pinned by
          # digest for reproducibility.
          docker run --rm \
            -v "$PWD/staging/apk:/repo" \
            -v "$PWD/key-build.sec:/key-build.sec" \
            alpine:edge@sha256:266f29255458134745f2bf588cb23ed1ed1768b96ff2580a05d70a8aba59e145 \
            sh -c 'for d in /repo/*/; do
                     (cd "$d" && apk mkndx --output packages.adb --allow-untrusted *.apk \
                       && apk adbsign --allow-untrusted --sign-key /key-build.sec packages.adb) || exit 1
                   done'
          find staging/apk -name packages.adb | sort

      - name: Assemble and index the opkg repository
        env:
          SIGN_KEY: ${{ secrets.TT_OPKG_SIGN_KEY }}
        run: |
          # opkg picks the package whose arch matches the device's arch list
          # out of a merged feed and ignores the rest ("has no valid
          # architecture, ignoring" — verified), so the opkg repository is a
          # SINGLE directory with every architecture's ipk files; the arch in
          # the file names keeps the builds apart.
          mkdir -p staging/opkg
          cp staging/luci-ipk/*.ipk staging/opkg/
          cp staging/opkg-pkgs/*.ipk staging/opkg/
          cp opkg-key.pub staging/opkg/
          # The canonical index script from the OpenWrt tree. Its $MKHASH
          # hook is OpenWrt's host tool, replaced here by a shim over
          # sha256sum.
          curl -fsSL -o ipkg-make-index.sh \
            https://raw.githubusercontent.com/openwrt/openwrt/openwrt-22.03/scripts/ipkg-make-index.sh
          printf '#!/bin/sh\nsha256sum "$2" | cut -d" " -f1\n' > mkhash.sh
          chmod +x mkhash.sh
          cd staging/opkg
          MKHASH="$PWD/../../mkhash.sh" bash ../../ipkg-make-index.sh . > Packages.manifest
          # Same field filter as OpenWrt's package/Makefile.
          grep -vE '^(Maintainer|LicenseFiles|Source|SourceName|Require|SourceDateEpoch)' \
            Packages.manifest > Packages
          rm -f Packages.manifest
          # Same padding workaround as OpenWrt's package/Makefile: usign
          # has a SHA-512 bug for two specific message sizes.
          case "$(((64 + $(stat -L -c%s Packages)) % 128))" in
            110|111) { echo ""; echo ""; } >> Packages ;;
          esac
          gzip -9nc Packages > Packages.gz
          cd ../..
          # Sign the UNCOMPRESSED Packages inside the OpenWrt rootfs image:
          # it carries the OpenWrt-patched usign. The private key exists
          # only as a workflow secret; its public half (opkg-key.pub,
          # committed in the repository) is carried to the site and installed
          # by install.sh into /etc/opkg/keys/ under its fingerprint.
          printf '%s\n' "$SIGN_KEY" > opkg.sec
          docker run --rm \
            -v "$PWD/staging/opkg:/repo" \
            -v "$PWD/opkg.sec:/opkg.sec" \
            openwrt/rootfs:x86-64-22.03.7 \
            sh -c 'cd /repo && usign -S -s /opkg.sec -m Packages -x Packages.sig'
          ls -la staging/opkg/

      # Nothing would notice a broken index or a mismatched signing key
      # until a user's apk update — so the repository is verified HERE,
      # exactly as install.sh configures it: the key in /etc/apk/keys, the
      # index URL of the device's own arch in /etc/apk/repositories.d. A
      # signature apk does not trust is skipped with "UNTRUSTED signature",
      # which makes the install below fail.
      - name: Verify the apk installs on 25.12
        run: |
          docker run --rm \
            -v "$PWD/staging/apk:/repo:ro" \
            openwrt/rootfs:x86-64-25.12.0 \
            sh -c '
              mkdir -p /etc/apk/keys /etc/apk/repositories.d
              cp /repo/key-build.pub /etc/apk/keys/trusttunnel.pub
              # The repository entry names the device'"'"'s own arch
              # directory — apk --print-arch, exactly as install.sh
              # constructs the URL. apk fetches the index at the URL
              # verbatim; a bare directory URL would make it look for
              # Alpine-style APKINDEX.tar.gz instead (see install.sh).
              echo "file:///repo/x86_64/packages.adb" > /etc/apk/repositories.d/trusttunnel.list
              apk update
              # Resolves the real dependencies (luci-base, kmod-tun, curl,
              # ...) against the version'"'"'s official feeds, plus the
              # arch-specific trusttunnel-client from the repository.
              apk add luci-app-trusttunnel-lite
              # The client is a hard dependency of the package; --version
              # proves the right binary landed and runs (statically linked,
              # no libc worries on musl).
              trusttunnel_client --version
            '
      # The ipk is built once, on the oldest SDK (22.03), and the release
      # design relies on it installing on 23.05/24.10 because the
      # dependencies are unversioned. That claim is verified HERE, on the
      # actual artifact, by installing it into the rootfs of each newer
      # version — with the same signed-feed arrangement install.sh
      # configures on a router. Building the package again on those SDKs
      # would prove nothing about the 22.03-built file.
      - name: Verify the ipk installs on 23.05/24.10
        run: |
          for img in x86-64-23.05.6 x86-64-24.10.8; do
            echo "== openwrt/rootfs:$img =="
            docker run --rm \
              -v "$PWD/staging/opkg:/repo:ro" \
              "openwrt/rootfs:$img" \
              sh -c '
                mkdir -p /var/lock /etc/opkg/keys
                # The feed key must be named by its usign fingerprint —
                # the same arrangement install.sh sets up on a router.
                cp /repo/opkg-key.pub /etc/opkg/keys/trusttunnel.pub
                fp=$(usign -F -p /etc/opkg/keys/trusttunnel.pub)
                cp /etc/opkg/keys/trusttunnel.pub "/etc/opkg/keys/$fp"
                # file:// works: opkg fetches <url>/Packages.gz and
                # Packages.sig and verifies the signature against the key
                # above — a missing or wrong key makes opkg update fail.
                echo "src/gz trusttunnel file:///repo" > /etc/opkg/customfeeds.conf
                opkg update
                # Resolves the real dependencies (luci-base, kmod-tun,
                # curl, ...) against the version'"'"'s official feeds, plus
                # the x86_64 trusttunnel-client from the merged feed.
                opkg install luci-app-trusttunnel-lite
                trusttunnel_client --version
              '
          done
      # The release assets are the package files: the apks from 25.12 and
      # the ipks from 22.03, every architecture included (the client apks
      # carry the appended arch in the name). Uploading from here — rather
      # than from each matrix job — gives the release a single writer: the
      # matrix jobs would otherwise update the same release concurrently.
      - name: Publish the release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            staging/luci-apk/*.apk
            staging/apk-pkgs/trusttunnel-client-*.apk
            staging/luci-ipk/*.ipk
            staging/opkg-pkgs/*.ipk
      - name: Assemble the site
        run: |
          mkdir -p site/apk site/opkg
          cp -r staging/apk/. site/apk/
          cp staging/opkg/*.ipk staging/opkg/Packages staging/opkg/Packages.gz \
             staging/opkg/Packages.sig staging/opkg/opkg-key.pub site/opkg/
          rm -rf staging
          # Directory indexes for humans: Pages serves no directory
          # listing, so the bare apk/ and opkg/ URLs would 404 in a
          # browser. The package managers never fetch the bare URLs (apk
          # fetches <url>/apk/<arch>/packages.adb, opkg appends
          # /Packages.gz), but a browsable page makes the repositories
          # discoverable. The templates live in the repository (repo-site/).
          cp repo-site/apk-index.html site/apk/index.html
          cp repo-site/opkg-index.html site/opkg/index.html
          # The theme's layout only shows a commented-out favicon example;
          # browsers still auto-request /favicon.ico, so a real one is
          # shipped to keep that request from 404ing.
          cp repo-site/favicon.ico site/favicon.ico
          # Jekyll config: points the theme's "Improve this page" link at
          # the real homepage template (main/repo-site/README.md) instead
          # of the stale Pages source branch.
          cp repo-site/_config.yml site/_config.yml
          # The site's homepage: the template lives in the repository
          # (repo-site/README.md) and the Jekyll build below renders it as
          # index.html — the same behavior branch-based Pages had. The
          # __TAG__ placeholder is substituted here; the Jekyll build then
          # renders the markdown with the GitHub Pages theme.
          cp repo-site/README.md site/README.md
          sed -i "s/__TAG__/$GITHUB_REF_NAME/g" site/README.md
      # The official GitHub Pages Jekyll builder: renders README.md as the
      # homepage (index.html) and copies the package files through
      # byte-identically.
      - name: Build the site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
